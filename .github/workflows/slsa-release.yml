name: SLSA Level 3 Release & Sigstore Attestation

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  slsa-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Setup Rust & WASM
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build Hermetic Artifacts
        run: |
          cargo build --manifest-path core/rust/Cargo.toml --release

      - name: Generate SPDX SBOM via Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'spdx-json'
          output: 'sbom.spdx.json'

      - name: Sign Release Artifacts via Cosign (Sigstore)
        run: |
          cosign sign-blob --yes sbom.spdx.json --output-signature sbom.spdx.json.sig
