name: JavaScript / TypeScript Code Quality & Testing

on:
  push:
    branches: [main, dev]
    paths:
      - 'web/**'
      - 'packages/typescript-sdk/**'
      - '.github/workflows/js.yml'
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: js-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Check
        id: check
        run: bash scripts/ci-preflight.sh js --optional

  lint-and-test:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Web Client Dependencies
        working-directory: web
        run: npm ci

      - name: Run Biome Linter & Code Formatter Check
        working-directory: web
        run: npx biome check ./src --reporter=github

      - name: Run TypeScript Compiler Check
        working-directory: web
        run: npx tsc -b --noEmit

      - name: Run Vitest Unit Test Suite
        working-directory: web
        run: npm test

      - name: Install & Compile TypeScript SDK
        run: |
          if [ -d "packages/typescript-sdk" ]; then
            cd packages/typescript-sdk
            npm ci
            npm run build
          fi
