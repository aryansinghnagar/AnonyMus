name: Python Code Quality & Testing

on:
  push:
    branches: [main, dev]
    paths:
      - '**/*.py'
      - 'requirements*.txt'
      - 'requirements*.in'
      - 'pyproject.toml'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight Check
        id: check
        run: bash scripts/ci-preflight.sh python --optional

  test:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install uv package manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system ruff pyright pytest pytest-cov pytest-asyncio black requests flask flask-limiter flask-socketio pynacl eventlet

      - name: Install v3 stack dependencies
        run: |
          uv pip install --system \
            "fastapi[standard]>=0.115" \
            "aiosqlite>=0.20" \
            "sqlalchemy>=2.0.36" \
            "httpx>=0.28" \
            "pydantic-settings>=2.6" \
            "structlog>=24.4" \
            "prometheus-client>=0.21" \
            "sentry-sdk[fastapi]>=2.0" \
            "bcrypt>=4.0" \
            "itsdangerous>=2.2"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Code Formatter Check
        run: ruff format --check core transports tests scripts

      - name: Run Pyright Type Checker
        run: pyright core/ || true

      - name: Run Pytest Test Suite with Coverage Check
        env:
          PYTHONPATH: .
          FLASK_SECRET_KEY: ci-testing-secret-key-do-not-use-in-production
          ANONYMUS_ENV: testing
        run: pytest tests/unit/ tests/integration/ --cov=core --cov=transports --cov-report=xml --cov-report=term-missing -m "not legacy"

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          fail_ci_if_error: false
