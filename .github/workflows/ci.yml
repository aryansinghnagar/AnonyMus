name: Unified CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch: {}
  workflow_call: {}

concurrency:
  group: unified-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format All Ecosystems
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Linters & Formatters
        run: pip install ruff black

      - name: Check Python Linting & Formatting
        run: |
          ruff check .
          ruff format --check core transports tests scripts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Node Dependencies
        working-directory: web
        run: npm ci

      - name: Check Web Formatting & Linting
        working-directory: web
        run: npx biome check ./src

  test-python-backend:
    name: Test Python Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv pytest pytest-asyncio pytest-cov httpx pydantic-settings structlog prometheus-client sentry-sdk bcrypt itsdangerous aiosqlite sqlalchemy
          uv pip install --system -r requirements.txt

      - name: Run Pytest with Coverage
        env:
          PYTHONPATH: .
        run: pytest tests/unit/ tests/integration/ --cov=core --cov=transports --cov-report=xml -m "not legacy"

  test-web-client:
    name: Test Web Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: npm ci
        working-directory: web

      - name: Run Vitest Unit Tests
        run: npm test
        working-directory: web

      - name: TypeScript Compiler Check
        run: npx tsc -b --noEmit
        working-directory: web
