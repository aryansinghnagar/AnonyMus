[workspace]
members = ["core/rust", "packages/desktop-client/src-tauri"]
default-members = ["core/rust"]
resolver = "2"

# Optimize dependency crates in dev & test profiles so crypto algorithms (Argon2, Kyber, Dalek) execute in milliseconds without pinning CPU cores
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
