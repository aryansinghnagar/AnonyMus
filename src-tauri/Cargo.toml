[package]
name = "anonymus-desktop"
version = "3.0.0"
description = "AnonyMus v3.0 Desktop Client (Tauri v2)"
authors = ["AnonyMus Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anonymus-core = { path = "../core/rust" }

[[bin]]
name = "anonymus-desktop"
path = "src/main.rs"
test = false
bench = false
doc = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
